apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: "q2git"
  annotations:
    description: "🔦 Query a remote API, jq filter, commit to a git repo. "
    wasmcloud.dev/authors: Mihai Galos
    wasmcloud.dev/source-url: https://github.com/mihaigalos/q2git/blob/main/wadm.yaml
    wasmcloud.dev/readme-md-url: https://github.com/mihaigalos/q2git/blob/main/README.md
    wasmcloud.dev/homepage: https://github.com/mihaigalos/q2git
    wasmcloud.dev/categories: |
      http,outgoing-http,http-server,tinygo,golang,jq
spec:
  components:
    - name: http-component
      type: component
      properties:
        image: "file://./build/q2git_s.wasm"
        config:
          - name: q2git-config
          - name: q2git-secrets
      traits:
        # Govern the spread/scheduling of the component
        - type: spreadscaler
          properties:
            instances: 1
        # Link to outgoing HTTP for making external requests
        - type: link
          properties:
            target: httpclient
            namespace: wasi
            package: http
            interfaces: [outgoing-handler]

    # Add a capability provider that enables HTTP access
    - name: httpserver
      type: capability
      properties:
        image: ghcr.io/wasmcloud/http-server:0.23.2
      traits:
        # Link the httpserver to the component, and configure the HTTP server
        # to listen on port 8000 for incoming requests
        #
        # Since the HTTP server calls the `http-component` component, we establish
        # a unidirectional link from this `httpserver` provider (the "source")
        # to the `http-component` component (the "target"), so the server can invoke
        # the component to handle a request.
        - type: link
          properties:
            target: http-component
            namespace: wasi
            package: http
            interfaces: [incoming-handler]
            source_config:
              - name: default-http
                properties:
                  address: 0.0.0.0:8000

    # Add HTTP client capability for outgoing requests
    - name: httpclient
      type: capability
      properties:
        image: ghcr.io/wasmcloud/http-client:0.13.0
